<div class="flex flex-col items-center justify-center p-2 bg-white rounded-lg border border-slate-200 shadow-xs text-center">
  <!-- Canvas for QR Code -->
  <div class="p-1.5 bg-white border border-slate-100 rounded-md shadow-inner flex items-center justify-center">
    <canvas #qrCanvas class="rounded"></canvas>
  </div>

  <div class="mt-2 flex items-center gap-1.5 text-[11px] text-slate-500 font-medium">
    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
    <span>رمز استجابة سريع معتمد (ZATCA TLV)</span>
  </div>

  <button
    *ngIf="showDetails"
    id="btn-copy-tlv-base64"
    type="button"
    (click)="copyTlvString()"
    class="mt-2 text-xs font-semibold px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition-colors flex items-center gap-1"
    title="نسخ نص Base64"
  >
    <span class="material-icons text-xs">{{ copied() ? 'check' : 'content_copy' }}</span>
    <span>{{ copied() ? 'تم النسخ!' : 'نسخ Base64 TLV' }}</span>
  </button>
</div>
